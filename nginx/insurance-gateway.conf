# 보험 API Gateway 설정
server {

    # Gateway 수신 포트
    listen 8081;

    # 로컬 개발 환경에서만 접근 허용
    server_name localhost;

    # 보험 REST API 라우팅
    location /api/ {

        # /api/ 경로를 제거하고 FastAPI로 전달
        proxy_pass http://127.0.0.1:8000/;

        # 원본 요청 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP 서버 라우팅
    location = /mcp {

        # MCP HTTP 서버로 요청 전달
        proxy_pass http://127.0.0.1:3000/mcp;

        # HTTP/1.1 사용
        proxy_http_version 1.1;

        # MCP Streamable HTTP 응답 스트리밍 지원
        proxy_buffering off;

        # 원본 요청 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /mcp/ 요청을 /mcp로 정규화
    location = /mcp/ {
        return 308 /mcp;
    }
}
